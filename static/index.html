<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зачёт по ценностным предложениям | Directum</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { display: inline-block; border-radius: 50%; border: 4px solid rgba(0,94,184,0.2); border-top-color: #005eb8; animation: spin 0.75s linear infinite; }
        .spinner-lg { width: 2.5rem; height: 2.5rem; }
    </style>
</head>
<body>
    <header class="directum-header">
        <img src="img/directum_logo.png" alt="Directum" />
        <span class="title">Зачёт по ценностным предложениям</span>
    </header>

    <main class="page-container">
        <div id="step1" class="card-directum" style="padding: 24px; margin-bottom: 16px;">
            <h2 style="margin: 0 0 16px; font-size: 1.25rem;">Шаг 1. Ваше ФИО</h2>
            <input type="text" id="fullName" placeholder="Иванов Иван Иванович" maxlength="500">
            <button type="button" id="btnStep1" class="btn-directum" style="margin-top: 12px; padding: 10px 20px; border-radius: 4px; cursor: pointer;">
                Далее
            </button>
        </div>

        <div id="step2" class="card-directum" style="padding: 24px; margin-bottom: 16px; display: none;">
            <h2 style="margin: 0 0 16px; font-size: 1.25rem;">Шаг 2. Выберите тему</h2>
            <div id="themeList"></div>
            <button type="button" id="btnBack2" style="margin-top: 12px; padding: 8px 16px; background: #eee; border: none; border-radius: 4px; cursor: pointer;">Назад</button>
        </div>

        <div id="step3" class="card-directum" style="padding: 24px; margin-bottom: 16px; display: none;">
            <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 8px;">
                <h2 style="margin: 0; font-size: 1.25rem;">Шаг 3. Запишите ответ</h2>
                <span id="sessionTimer" style="font-size: 0.8rem; color: #999;"></span>
            </div>
            <p id="selectedThemeName" style="color: #666; margin: 0 0 16px;"></p>
            <div id="recordArea">
                <button type="button" id="btnRecord" class="btn-directum" style="padding: 14px 28px; border-radius: 4px; cursor: pointer; font-size: 1rem;">
                    Нажать и говорить
                </button>
                <p id="recordStatus" style="margin: 12px 0 0; color: #666; font-size: 0.9rem;"></p>
            </div>
            <div id="submitArea" style="display: none;">
                <p style="margin: 0 0 12px;">Запись готова. Отправьте на проверку.</p>
                <button type="button" id="btnSubmit" class="btn-directum" style="padding: 12px 24px; border-radius: 4px; cursor: pointer;">Отправить на проверку</button>
                <button type="button" id="btnRerecord" style="margin-left: 8px; padding: 12px 24px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">Записать заново</button>
            </div>
            <div id="loadingArea" style="display: none;">
                <div class="loading-overlay">
                    <div class="spinner spinner-lg"></div>
                    <div class="loading-label">Идёт распознавание речи и оценка ответа.<br>Обычно занимает 15–40 секунд.</div>
                </div>
            </div>
            <button type="button" id="btnBack3" style="margin-top: 16px; padding: 8px 16px; background: #eee; border: none; border-radius: 4px; cursor: pointer;">Назад</button>
        </div>

        <div id="step4" class="card-directum" style="padding: 24px; display: none;">
            <h2 style="margin: 0 0 16px; font-size: 1.25rem;">Результат</h2>
            <div id="resultContent" style="white-space: pre-wrap; background: #f8f9fa; padding: 16px; border-radius: 4px; border: 1px solid #eee;"></div>
            <p id="resultScore" style="margin-top: 12px; font-weight: 600;"></p>
            <button type="button" id="btnNewTest" class="btn-directum" style="margin-top: 16px; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Пройти ещё раз</button>
        </div>
    </main>

    <script src="js/test.js"></script>
</body>
</html>
